<!DOCTYPE html>
<html>
<head>
  <title>Hi Mama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(to bottom, #fffaf5, #ffffff);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 320px;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      opacity: 0.7;
      margin-bottom: 40px;
    }

    .circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ffb6a3;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      font-size: 18px;
      color: white;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .circle:active {
      transform: scale(0.95);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .status {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.6;
      height: 20px;
    }

    .sound-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 24px;
    }

    .sound-links a {
      border: 1px solid rgba(255, 182, 163, 0.9);
      border-radius: 999px;
      color: #9c4f42;
      font-size: 13px;
      padding: 6px 10px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Hi Mama, love Neira❤️</h1>
  <p>Tap to hear a moment</p>

  <div class="circle" onclick="playClip()">Play</div>

  <div class="status" id="statusText"></div>
  <div class="sound-links" id="soundLinks"></div>
</div>

<audio id="player"></audio>

<script>
  const clips = [
    { id: "neira-hi", label: "Neira hi", src: "https://slimpow.github.io/hi-mama/neira-hi.mp3" },
    { id: "hello", label: "Hello", src: "https://slimpow.github.io/hi-mama/hello.mp3" },
    { id: "woofwoof", label: "Woof woof", src: "https://slimpow.github.io/hi-mama/woofwoof.mp3" },
    { id: "ohhhh", label: "Ohhhh", src: "https://slimpow.github.io/hi-mama/ohhhh.mp3" },
    { id: "book", label: "Book", src: "https://slimpow.github.io/hi-mama/book.mp3" },
    { id: "yodel", label: "Yodel", src: "https://slimpow.github.io/hi-mama/yodel.mp3" },
    { id: "yoto", label: "Yoto", src: "https://slimpow.github.io/hi-mama/yoto.mp3" },
    { id: "ok", label: "Ok", src: "https://slimpow.github.io/hi-mama/ok.mp3" },
    { id: "baby", label: "Baby", src: "https://slimpow.github.io/hi-mama/baby.mp3" },
    { id: "airplane", label: "Airplane", src: "https://slimpow.github.io/hi-mama/airplane.mp3" },
    { id: "opa", label: "Opa", src: "https://slimpow.github.io/hi-mama/opa.mp3" },
    { id: "gigi", label: "Gigi", src: "https://slimpow.github.io/hi-mama/gigi.mp3" }
  ];

  const qrSlots = {
    "1": "neira-hi",
    "2": "hello",
    "3": "woofwoof",
    "4": "ohhhh",
    "5": "book",
    "6": "yodel",
    "7": "yoto",
    "8": "ok",
    "9": "baby",
    "10": "airplane",
    "11": "opa",
    "12": "gigi"
  };

  const params = new URLSearchParams(window.location.search);
  const selectedQrSlot = params.get("qr");
  const selectedQrSoundId = qrSlots[selectedQrSlot];
  const selectedSoundId = params.get("sound");
  const selectedClip = clips.find((clip) => clip.id === (selectedQrSoundId || selectedSoundId));
  let shuffledClipQueue = [];
  let lastPlayedClipId = "";

  function shuffleClips() {
    const shuffled = [...clips];

    for (let index = shuffled.length - 1; index > 0; index--) {
      const randomIndex = Math.floor(Math.random() * (index + 1));
      [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
    }

    if (shuffled.length > 1 && shuffled[0].id === lastPlayedClipId) {
      [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
    }

    return shuffled;
  }

  function nextRandomClip() {
    if (shuffledClipQueue.length === 0) {
      shuffledClipQueue = shuffleClips();
    }

    return shuffledClipQueue.shift();
  }

  function renderSoundLinks() {
    const links = document.getElementById("soundLinks");
    const baseUrl = `${window.location.origin}${window.location.pathname}`;

    if (selectedClip) {
      const allSoundsLink = document.createElement("a");
      allSoundsLink.href = baseUrl;
      allSoundsLink.innerText = "All sounds";
      links.appendChild(allSoundsLink);
    }

    clips.forEach((clip) => {
      const link = document.createElement("a");
      link.href = `${baseUrl}?sound=${encodeURIComponent(clip.id)}`;
      link.innerText = clip.label;
      links.appendChild(link);
    });
  }

  function playClip() {
    const player = document.getElementById("player");
    const status = document.getElementById("statusText");
    const clip = selectedClip || nextRandomClip();

    status.innerText = "playing…";

    player.src = clip.src;
    player.load();
    lastPlayedClipId = clip.id;

    player.play().then(() => {
      status.innerText = "";
    }).catch(() => {
      status.innerText = "tap again to play";
    });
  }

  if (selectedClip) {
    document.querySelector("p").innerText = `Tap to hear ${selectedClip.label}`;
  }

  document.addEventListener("keydown", (event) => {
    if (event.code === "Space" && !event.repeat) {
      event.preventDefault();
      playClip();
    }
  });

  renderSoundLinks();
</script>

</body>
</html>
